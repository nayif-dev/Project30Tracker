<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PROJECT 30</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mu:#777;--ln:#d8d8d8;--p:#f3f3f3;--ac:#d71921;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

#app{display:flex;min-height:100vh}nav{width:170px;border-right:1px solid var(--ln);padding:14px 0;position:sticky;top:0;height:100vh;flex:none}
nav b{display:block;padding:0 14px 14px;font:600 14px "IBM Plex Mono",monospace}nav b i{color:var(--ac);font-style:normal}

.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.c{border:1px solid var(--ln);padding:12px;background:var(--p)}
.c small,.l{color:var(--mu);font:11px "IBM Plex Mono",monospace;letter-spacing:.08em;display:block}.c .v{font:600 22px "IBM Plex Mono",monospace;margin-top:4px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:left;font-size:12px;vertical-align:top}th{color:var(--mu);font-weight:400}
.bar{height:6px;background:var(--ln)}.bar i{display:block;height:100%;background:var(--ac)}.t{display:inline-block;border:1px solid var(--ln);padding:0 6px;font:11px "IBM Plex Mono",monospace}
.red{color:var(--ac)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.gt{min-width:680px;position:relative}.gh,.gr{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}.gh span{display:grid;grid-template-columns:repeat(8,1fr);font:11px "IBM Plex Mono",monospace;color:var(--mu)}
.gr{padding:5px 0;border-top:1px solid var(--ln)}.gb{position:relative;height:16px;background:repeating-linear-gradient(90deg,var(--ln) 0 1px,transparent 1px 12.5%)}.gb u{position:absolute;top:0;height:100%;border:1px solid var(--fg);text-decoration:none}.gb u i{display:block;height:100%;background:var(--ac)}.gb s{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--ac)}
dialog{border:1px solid var(--fg);background:var(--bg);color:var(--fg);max-width:min(520px,94vw);width:100%;padding:16px;max-height:92vh;overflow:auto}dialog::backdrop{background:#0008}
.mf label{display:block;margin:8px 0;font:11px "IBM Plex Mono",monospace;color:var(--mu)}.mf input,.mf select,.mf textarea{display:block;width:100%;margin-top:3px;font:13px Inter,sans-serif}.r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
pre{white-space:pre-wrap;font:12px "IBM Plex Mono",monospace;margin:0}
@media(max-width:760px){#app{flex-direction:column-reverse}nav{width:100%;height:auto;position:sticky;bottom:0;display:flex;overflow-x:auto;border-top:1px solid var(--ln);border-right:0;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--bg)}nav b{display:none}nav button{width:auto;white-space:nowrap;padding:12px}nav button.on{box-shadow:inset 0 2px var(--ac)}main{padding:12px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><div id="w"><header><input id="sq" placeholder="SEARCH EVERYTHING"></header><main id="main"></main></div></div>
<dialog id="m"></dialog><dialog id="cd"></dialog>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['TODO','IN PROGRESS','COMPLETED','BLOCKED'],PR=['LOW','MEDIUM','HIGH','CRITICAL'],PS=['NOT STARTED','IN PROGRESS','COMPLETED','BLOCKED'],
PCS=['PLANNED','ORDERED','PURCHASED','RECEIVED','TESTED'],PAY=['UPI','Cash','Bank Transfer','Other'],
CAT=['Hardware','Sensor','Microcontroller','Battery','Charging','PCB','Wiring','Tools','Software','Cloud','Printing','Travel','Other'],
EVT=['Bills','Hardware Photos','Project Photos','Test Results','Screenshots','Research Papers','Meeting Notes','Reports','Presentations','Other'],
RS=['TO READ','READ','ANALYZED','USED IN REPORT'];
const NAV=[['dash','Dashboard'],['time','Timeline'],['phs','Phases'],['tsk','Tasks'],['team','Team'],['fin','Finance'],['prc','Procurement'],['evd','Evidence'],['res','Research'],['info','Project Info'],['sett','Settings']];
const PH=[['Requirement Analysis','2026-08-01','2026-08-31'],['Literature Review','2026-08-01','2026-09-30'],['System Design & Procurement','2026-09-01','2026-10-31'],['Sensor Integration','2026-10-01','2026-11-30'],['ESP32 Firmware','2026-10-01','2026-12-31'],['Mobile Application','2026-11-01','2026-12-31'],['Testing & Debugging','2026-12-01','2027-01-31'],['Documentation','2027-01-01','2027-02-28'],['Final Review & Presentation','2027-02-01','2027-03-31']];
const init=()=>({seq:{t:1,x:1},set:{name:'PROJECT 30',code:'CSD415',budget:0,start:'2026-08-01',end:'2027-03-31',cur:'₹'},
members:[['Rabia Baiju','TKI23CA042'],['Nayif Shanavas','TKI23CA036'],['Muhammed Fahrudeen N','TKI23CA031'],['Abhinand','TKI23CA003']].map(([name,roll],i)=>({id:'m'+i,name,roll})),
phases:PH.map(([name,start,end],i)=>({id:'p'+i,name,start,end,status:'NOT STARTED',prog:0,mem:[],notes:''})),tasks:[],contribs:[],exps:[],
proc:['ESP32','MAX30102','MPU6050','DS18B20 / MLX90614','Li-ion Battery','Charging Module','SOS Button'].map((name,i)=>({id:'i'+i,name,cat:'Hardware',req:1,qty:0,status:'PLANNED',est:'',cost:'',by:'',date:'',vendor:'',phase:'p2',notes:''})),
ev:[],papers:[],log:[]});
let S,page='dash',q='',F={};
let PERSIST=true;
const db=new Promise((r,j)=>{try{const o=indexedDB.open('project30',1);o.onupgradeneeded=()=>{o.result.createObjectStore('kv');o.result.createObjectStore('files')};o.onsuccess=()=>r(o.result);o.onerror=o.onblocked=()=>j(o.error||'blocked')}catch(e){j(e)}});db.catch(()=>{});
window.onerror=(m,u,l)=>{const x=$('#main');if(x)x.insertAdjacentHTML('afterbegin',`<pre class="red">ERROR: ${esc(m)} (line ${l})</pre>`)};
const tx=async(st,m,f)=>{const d=await db;return new Promise((a,b)=>{const t=d.transaction(st,m),r=f(t.objectStore(st));t.oncomplete=()=>a(r.result);t.onerror=()=>b(t.error)})};
const save=()=>PERSIST?tx('kv','readwrite',s=>s.put(S,'s')).catch(()=>{PERSIST=false;render()}):Promise.resolve();
const mn=id=>S.members.find(m=>m.id==id)?.name.split(' ')[0]||'—',pn=id=>S.phases.find(p=>p.id==id)?.name||'—';
const fmt=n=>S.set.cur+Number(n||0).toLocaleString('en-IN'),sum=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);
const log=(who,text)=>S.log.unshift({t:Date.now(),who,text});
const tk=t=>'T-'+String(t).padStart(3,'0'),xk=n=>'EXP-'+String(n).padStart(3,'0');
const mo=()=>S.members.map(m=>[m.id,m.name]),po=()=>S.phases.map(p=>[p.id,p.name]),mo0=()=>[['','—'],...mo()],po0=()=>[['','—'],...po()];
const phProg=p=>{const t=S.tasks.filter(x=>x.phase==p.id);return t.length?Math.round(t.filter(x=>x.status=='COMPLETED').length/t.length*100):Number(p.prog||0)};
const totalProg=()=>S.phases.length?Math.round(S.phases.reduce((s,p)=>s+phProg(p),0)/S.phases.length):0;
const over=t=>t.due&&t.due<today()&&t.status!='COMPLETED';
const bar=n=>`<div class="bar"><i style="width:${n}%"></i></div>`;
const tb=(h,r)=>`<div class="sc"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="l">NONE YET</td></tr>`}</table></div>`;
const bt=(a,id,l,c='')=>`<button class="${c}" data-a="${a}" data-id="${id}">${l}</button>`;
const card=(l,v)=>`<div class="c"><small>${l}</small><div class="v">${v}</div></div>`;
const sel=(k,opts,all)=>`<select data-f="${k}"><option value="">${all}</option>${opts.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${a}"${F[k]==a?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
const fin=()=>{const tc=sum(S.contribs),te=sum(S.exps);return{tc,te,bal:tc-te,rem:S.set.budget-te}};
const finCards=()=>{const f=fin();return`<div class="g">${card('BUDGET',fmt(S.set.budget))}${card('CONTRIBUTED',fmt(f.tc))}${card('SPENT',fmt(f.te))}${card('BALANCE',fmt(f.bal))}${card('BUDGET REMAINING',fmt(f.rem))}</div>`};
function health(){const r=[],d=today();const od=S.tasks.filter(over),hi=od.filter(t=>['HIGH','CRITICAL'].includes(t.pri)),bl=S.tasks.filter(t=>t.status=='BLOCKED');
const late=S.phases.filter(p=>p.end<d&&p.status!='COMPLETED'),ns=S.phases.filter(p=>p.start<=d&&p.end>=d&&p.status=='NOT STARTED');
if(late.length)r.push(`${late.length} phase(s) past planned end and not completed`);if(od.length>=3)r.push(`${od.length} tasks overdue`);
const lvl=late.length||od.length>=3?'DELAYED':'';if(!lvl){if(hi.length)r.push(`${hi.length} high-priority task(s) overdue`);else if(od.length)r.push(`${od.length} task(s) overdue`);if(bl.length)r.push(`${bl.length} blocked task(s)`);if(ns.length)r.push(`${ns.length} phase(s) in planned window but not started`)}
return{s:lvl||(r.length?'AT RISK':'ON TRACK'),why:r.length?r.join('; '):'No overdue tasks, blocked work or missed phase dates.'}}
/* forms */
const D={
t:{a:'tasks',n:'Task',lbl:x=>x.name,f:()=>[['name','Task name','text'],['phase','Phase','select',po()],['mem','Assigned to','select',mo0()],['status','Status','select',ST],['pri','Priority','select',PR],['start','Start','date'],['due','Due','date'],['est','Est. effort (h)','number'],['act','Actual effort (h)','number'],['desc','Description','textarea'],['notes','Notes','textarea'],['file','Attachment','file']],d:()=>({status:'TODO',pri:'MEDIUM',phase:S.phases[0]?.id})},
c:{a:'contribs',n:'Contribution',lbl:x=>fmt(x.amount),f:()=>[['mem','Member','select',mo()],['amount','Amount','number'],['date','Date','date'],['pay','Payment method','select',PAY],['note','Reference / note','text']],d:()=>({date:today(),pay:'UPI'})},
e:{a:'exps',n:'Expense',lbl:x=>x.item,f:()=>[['item','Item','text'],['amount','Amount','number'],['date','Date','date'],['cat','Category','select',CAT],['by','Purchased by','select',mo()],['vendor','Vendor','text'],['pay','Payment method','select',PAY],['phase','Phase','select',po0()],['proc','Procurement item','select',[['','—'],...S.proc.map(p=>[p.id,p.name])]],['desc','Description','textarea'],['notes','Notes','text'],['file','Bill / receipt','file']],d:()=>({date:today(),cat:'Hardware',pay:'UPI'})},
p:{a:'proc',n:'Item',lbl:x=>x.name,f:()=>[['name','Item','text'],['cat','Category','select',CAT],['req','Required qty','number'],['qty','Purchased qty','number'],['status','Status','select',PCS],['est','Estimated cost','number'],['cost','Actual cost','number'],['by','Purchased by','select',mo0()],['date','Purchase date','date'],['vendor','Vendor','text'],['phase','Phase','select',po0()],['notes','Notes','text']],d:()=>({status:'PLANNED',cat:'Hardware',req:1,qty:0})},
v:{a:'ev',n:'Evidence',lbl:x=>x.title,f:()=>[['title','Title','text'],['type','Type','select',EVT],['date','Date','date'],['phase','Related phase','select',po0()],['task','Related task','select',[['','—'],...S.tasks.map(t=>[t.id,tk(t.n)+' '+t.name])]],['mem','Uploaded by','select',mo0()],['desc','Description','textarea'],['file','File','file']],d:()=>({date:today(),type:'Other'})},
r:{a:'papers',n:'Paper',lbl:x=>x.title,f:()=>[['title','Title','text'],['authors','Authors','text'],['year','Year','number'],['contrib','Contribution','textarea'],['limit','Limitation','textarea'],['status','Status','select',RS],['link','Link','text'],['notes','Notes','textarea']],d:()=>({status:'TO READ'})},
h:{a:'phases',n:'Phase',lbl:x=>x.name,f:()=>[['name','Phase name','text'],['status','Status','select',PS],['start','Planned start','date'],['end','Planned end','date'],['prog','Progress % (used when no tasks)','number'],['notes','Notes','textarea']],d:()=>({status:'NOT STARTED',prog:0,mem:[],start:today(),end:today()})},
m:{a:'members',n:'Member',lbl:x=>x.name,f:()=>[['name','Name','text'],['roll','Roll no.','text']],d:()=>({})}};
function form(title,fields,v,ok){const d=$('#m');
d.innerHTML=`<form class="mf"><h2 style="margin-top:0">${title}</h2>${fields.map(([k,l,t,o],i)=>{const r=i==0||k=='amount'?' required':'';return`<label>${l}`+(t=='select'?`<select name="${k}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${v[k]==a?' selected':''}>${esc(b)}</option>`}).join('')}</select>`:t=='textarea'?`<textarea name="${k}">${esc(v[k])}</textarea>`:t=='file'?`<input type="file" name="${k}" accept=".pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf">${v.fn?`<small>Current: ${esc(v.fn)}</small>`:''}`:`<input name="${k}" type="${t}" value="${esc(v[k])}"${t=='number'?' min="0" step="any"':''}${r}>`)+`</label>`}).join('')}<div class="r"><button type="button" data-a="close">Cancel</button><button class="pri">Save</button></div></form>`;
d.showModal();d.querySelector('form').onsubmit=async e=>{e.preventDefault();const o={};for(const[k,x]of new FormData(e.target))o[k]=x;
if('amount' in o&&!(Number(o.amount)>0))return alert2('Amount must be greater than 0.');
if(o.file&&o.file.size){const id=uid();await tx('files','readwrite',s=>s.put(o.file,id));if(v.fid)await tx('files','readwrite',s=>s.delete(v.fid));o.fid=id;o.fn=o.file.name}delete o.file;await ok(o);d.close();await save();render()}}
const alert2=m=>{$('#cd').innerHTML=`<p>${m}</p><div class="r"><button data-a="closec">OK</button></div>`;$('#cd').showModal()};
const ask=(m,fn)=>{$('#cd').innerHTML=`<p>${m}</p><div class="r"><button data-a="closec">Cancel</button><button class="pri x" id="yes">Confirm</button></div>`;$('#cd').showModal();$('#yes').onclick=async()=>{$('#cd').close();await fn();await save();render()}};
const A={go:id=>{page=id;q='';$('#sq').value='';render()},close:()=>$('#m').close(),closec:()=>$('#cd').close(),
new:k=>{const c=D[k];form('ADD '+c.n.toUpperCase(),c.f(),{...c.d(),...(F.pre||{})},o=>{o.id=uid();if(k=='t'){o.n=S.seq.t++;if(o.status=='COMPLETED')o.done=today()}if(k=='e')o.n=S.seq.x++;if(k=='h')o.mem=[];S[c.a].push(o);log(mn(o.mem||o.by),`added ${c.n.toLowerCase()}: ${c.lbl(o)}`)})},
edit:(id,t)=>{const k=t.dataset.k,c=D[k],v=S[c.a].find(x=>x.id==id);form('EDIT '+c.n.toUpperCase(),c.f(),v,o=>{if(k=='t'){if(o.status=='COMPLETED'&&!v.done)o.done=today();if(o.status!='COMPLETED')o.done=''}Object.assign(v,o);log(mn(v.mem||v.by),`updated ${c.n.toLowerCase()}: ${c.lbl(v)}`)})},
del:(id,t)=>{const k=t.dataset.k,c=D[k],v=S[c.a].find(x=>x.id==id);if(k=='h'&&S.tasks.some(x=>x.phase==id))return alert2('Move or delete this phase\'s tasks first.');
ask(`Delete ${c.n.toLowerCase()} "${esc(c.lbl(v))}"${v.fid?' and its attached file':''}? ${k=='c'||k=='e'?'The balance will be recalculated.':''}`,async()=>{S[c.a]=S[c.a].filter(x=>x.id!=id);if(v.fid)await tx('files','readwrite',s=>s.delete(v.fid));log('Team',`deleted ${c.n.toLowerCase()}: ${c.lbl(v)}`)})},
tog:id=>{const t=S.tasks.find(x=>x.id==id);if(t.status=='COMPLETED'){t.status='TODO';t.done=''}else{t.status='COMPLETED';t.done=today()}log(mn(t.mem),`${t.status=='COMPLETED'?'completed':'reopened'} task: ${t.name}`);save().then(render)},
ph:id=>{page='ph:'+id;render()},
addt:id=>{F.pre={phase:id};A.new('t');F.pre=null},
file:async id=>{const b=await tx('files','readonly',s=>s.get(id));if(!b)return alert2('File not found.');const u=URL.createObjectURL(b);$('#cd').innerHTML=`${b.type.startsWith('image')?`<img src="${u}" style="max-width:100%">`:`<iframe src="${u}" style="width:100%;height:60vh;border:0"></iframe>`}<div class="r"><a href="${u}" download>Download</a><button data-a="closec">Close</button></div>`;$('#cd').showModal()},
set:()=>form('PROJECT SETTINGS',[['name','Project name','text'],['code','Project code','text'],['budget','Project budget','number'],['start','Start date','date'],['end','End date','date'],['cur','Currency symbol','text']],S.set,o=>{o.budget=Number(o.budget)||0;Object.assign(S.set,o)}),
json:async()=>{const files={};await Promise.all((await tx('files','readonly',s=>s.getAllKeys())).map(async k=>{const b=await tx('files','readonly',s=>s.get(k));files[k]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}));out('project30-backup.json',JSON.stringify({S,files}))},
csv:k=>{const L={tasks:S.tasks.map(t=>({id:tk(t.n),name:t.name,phase:pn(t.phase),member:mn(t.mem),status:t.status,priority:t.pri,start:t.start,due:t.due,done:t.done})),exps:S.exps.map(e=>({id:xk(e.n),date:e.date,item:e.item,amount:e.amount,category:e.cat,by:mn(e.by),vendor:e.vendor,phase:pn(e.phase)})),contribs:S.contribs.map(c=>({member:mn(c.mem),amount:c.amount,date:c.date,method:c.pay,note:c.note})),ledger:ledger().map(r=>({date:r.date,type:r.type,description:r.d,member:r.m,amount:r.amount,dir:r.type=='EXPENSE'?'OUT':'IN',balance:r.bal})),proc:S.proc.map(p=>({item:p.name,status:p.status,req:p.req,qty:p.qty,est:p.est,cost:p.cost,by:mn(p.by),vendor:p.vendor})),members:S.members.map(m=>({member:m.name,...mfin(m.id)}))}[k];
const h=Object.keys(L[0]||{});out(k+'.csv',[h,...L.map(r=>h.map(x=>`"${String(r[x]??'').replace(/"/g,'""')}"`))].map(r=>r.join(',')).join('\n'))},
imp:()=>$('#imp').click(),
reset:()=>ask('Erase ALL project data, files and history? Export a backup first.',async()=>{S=init();await tx('files','readwrite',s=>s.clear())})};
function out(n,t){const u=URL.createObjectURL(new Blob([t]));$('#cd').innerHTML=`<p class="l">${n} — copy below or download</p><textarea style="width:100%;height:40vh;font:11px monospace" readonly>${esc(t.length>400000?t.slice(0,400000)+'…(use Download for full)':t)}</textarea><div class="r"><a href="${u}" download="${n}">Download</a><button data-a="closec">Close</button></div>`;$('#cd').showModal()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)A[t.dataset.a]?.(t.dataset.id,t)});
document.addEventListener('change',e=>{if(e.target.dataset.f){F[e.target.dataset.f]=e.target.value;render()}if(e.target.id=='imp'){const f=e.target.files[0];if(!f)return;f.text().then(async x=>{try{const j=JSON.parse(x);if(!j.S?.phases)throw 0;ask('Replace current data with this backup?',async()=>{S=j.S;await tx('files','readwrite',s=>s.clear());for(const[k,v]of Object.entries(j.files||{})){const bl=await (await fetch(v)).blob();await tx('files','readwrite',s=>s.put(bl,k))}});}catch{alert2('Invalid backup file.')}e.target.value=''})}});
$('#sq').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
/* ledger/members */
function ledger(){const r=[...S.contribs.map(c=>({...c,type:'CONTRIBUTION',d:c.note||'Contribution',m:mn(c.mem),cat:'',k:'c'})),...S.exps.map(e=>({...e,type:'EXPENSE',d:e.item,m:mn(e.by),k:'e'}))].sort((a,b)=>(a.date||'').localeCompare(b.date||''));let b=0;return r.map(x=>(b+=x.type=='EXPENSE'?-x.amount:+x.amount,{...x,bal:b}))}
const mfin=id=>({contributed:sum(S.contribs.filter(c=>c.mem==id)),paid_for_purchases:sum(S.exps.filter(e=>e.by==id)),transactions:S.contribs.filter(c=>c.mem==id).length+S.exps.filter(e=>e.by==id).length});
/* pages */
